name: PMS QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pms-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ngwd_erp_test
          MYSQL_USER: ngwd_test
          MYSQL_PASSWORD: ngwd_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI_ENVIRONMENT: testing
      database.tests.hostname: 127.0.0.1
      database.tests.database: ngwd_erp_test
      database.tests.username: ngwd_test
      database.tests.password: ngwd_test
      database.tests.DBDriver: MySQLi
      database.tests.port: 3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, mysqli, pdo_mysql
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Run PMS authorization tests
        run: vendor/bin/phpunit tests/unit/Services --colors=always
